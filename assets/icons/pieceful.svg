<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ede5d6"/>
    </linearGradient>
    <linearGradient id="piece-grad" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#4a8189"/>
      <stop offset="100%" stop-color="#1f4348"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b59a"/>
      <stop offset="100%" stop-color="#c4623d"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg-grad)"/>

  <!-- Main puzzle piece -->
  <path
    d="M 22 22
       L 42 22
       C 42 14 58 14 58 22
       L 78 22
       L 78 42
       C 86 42 86 58 78 58
       L 78 78
       L 58 78
       C 58 86 42 86 42 78
       L 22 78
       L 22 58
       C 14 58 14 42 22 42
       Z"
    fill="url(#piece-grad)"
  />

  <!-- Accent: small terra-cotta piece tucked in upper right -->
  <path
    d="M 78 22
       L 88 22
       L 88 42
       C 92 42 92 50 88 50
       L 88 58
       L 78 58
       Z"
    fill="url(#accent-grad)"
    opacity="0.92"
  />
</svg>
